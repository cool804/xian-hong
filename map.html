<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>臺灣海域漁獲動態視覺圖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #eef8fb 0%, #e7f3f6 100%);
      color: #153447;
      padding: 28px;
    }

    .app-layout {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 26px;
      align-items: stretch;
    }

    .map-panel,
    .info-panel {
      background: white;
      border-radius: 28px;
      padding: 26px;
      box-shadow: 0 18px 45px rgba(22, 69, 91, 0.12);
      border: 1px solid #ddedf2;
    }

    .season-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .season-tabs button {
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #e8f4f7;
      color: #285468;
      cursor: pointer;
      font-weight: 800;
      transition: 0.2s;
    }

    .season-tabs button.active,
    .season-tabs button:hover {
      background: #0f87a6;
      color: white;
      transform: translateY(-2px);
    }

    .taiwan-map {
      position: relative;
      height: 520px;
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 18%, rgba(255,255,255,0.28) 0 2px, transparent 3px),
        radial-gradient(circle at 86% 72%, rgba(255,255,255,0.20) 0 2px, transparent 3px),
        linear-gradient(145deg, #d6f5ff 0%, #71c3e8 42%, #1679bd 100%);
      border: 1px solid #c6e5ef;
    }

    .map-title {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 3;
      color: #0c506c;
      background: rgba(255,255,255,0.82);
      padding: 10px 14px;
      border-radius: 16px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .map-svg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(58%, 300px);
      max-height: 82%;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 18px 26px rgba(0, 55, 95, 0.25));
      z-index: 2;
    }

    .taiwan-land {
      fill: url(#landGradient);
      stroke: rgba(255,255,255,0.92);
      stroke-width: 5;
    }

    .mountain-line {
      fill: none;
      stroke: rgba(33, 104, 76, 0.36);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 8 10;
    }

    .city-dot {
      fill: #f7c76a;
      stroke: white;
      stroke-width: 2;
    }

    .city-label {
      fill: #1e5a62;
      font-size: 18px;
      font-weight: 800;
      paint-order: stroke;
      stroke: rgba(255,255,255,0.86);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .sea-region {
      position: absolute;
      z-index: 1;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .sea-north {
      top: 80px;
      left: 32%;
      width: 36%;
      height: 105px;
      border-radius: 46% 54% 42% 58%;
    }

    .sea-east {
      top: 165px;
      right: 20px;
      width: 33%;
      height: 260px;
      border-radius: 58% 42% 52% 48%;
    }

    .sea-west {
      top: 165px;
      left: 20px;
      width: 33%;
      height: 260px;
      border-radius: 42% 58% 48% 52%;
    }

    .sea-south {
      bottom: 48px;
      left: 31%;
      width: 38%;
      height: 105px;
      border-radius: 50% 50% 55% 45%;
    }

    .area-btn {
      position: absolute;
      z-index: 4;
      min-width: 128px;
      padding: 11px 14px;
      border: 2px solid rgba(255,255,255,0.8);
      background: rgba(8, 102, 139, 0.88);
      color: white;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(0,0,0,0.2);
      transition: 0.25s;
    }

    .area-btn:hover,
    .area-btn.active {
      background: #ffb84d;
      color: #173b4b;
      transform: scale(1.06);
    }

    .area-north { top: 92px; left: 50%; translate: -50% 0; }
    .area-east { top: 250px; right: 28px; }
    .area-west { top: 250px; left: 28px; }
    .area-south { bottom: 65px; left: 50%; translate: -50% 0; }

    .penghu {
      position: absolute;
      left: 33%;
      top: 47%;
      z-index: 3;
      color: #194e62;
      font-size: 0.82rem;
      font-weight: 900;
      background: rgba(255,255,255,0.72);
      padding: 4px 8px;
      border-radius: 999px;
    }

    .penghu::before,
    .penghu::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: #eed27d;
      border: 2px solid white;
      border-radius: 50%;
    }

    .penghu::before { left: -18px; top: 6px; }
    .penghu::after { left: -28px; top: 20px; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      color: #426172;
      font-size: 0.95rem;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .green { background: #2eae62; }
    .yellow { background: #f5b942; }
    .red { background: #d94d4d; }

    .fish-card {
      border-radius: 26px;
      overflow: hidden;
      background: #f6fbfd;
      border: 1px solid #d8edf3;
    }

    .fish-image {
      min-height: 230px;
      background:
        linear-gradient(rgba(10,45,65,.18), rgba(10,45,65,.18)),
        url("https://images.unsplash.com/photo-1534043464124-3be32fe000c9?auto=format&fit=crop&w=1000&q=80") center/cover;
      display: flex;
      align-items: end;
      padding: 22px;
      color: white;
    }

    .fish-image h3 {
      font-size: 2rem;
      text-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    .fish-content {
      padding: 24px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 14px;
      background: white;
      border: 1px solid #d8edf3;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .fish-content p {
      line-height: 1.8;
      color: #4d6b78;
      margin-bottom: 16px;
    }

    .data-bars {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .bar-row span {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      margin-bottom: 7px;
      color: #315467;
      font-weight: 700;
    }

    .bar-bg {
      height: 12px;
      border-radius: 999px;
      background: #dcecf2;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #12a3c7, #7cd0e0);
      transition: width 0.4s;
    }

    .fish-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .mini-fish {
      background: white;
      border: 1px solid #dbeef3;
      border-radius: 18px;
      padding: 18px;
    }

    .mini-fish strong {
      display: block;
      margin-bottom: 8px;
      color: #174f6a;
    }

    .mini-fish small {
      color: #65818d;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      body { padding: 18px; }
      .app-layout { grid-template-columns: 1fr; }
      .taiwan-map { height: 540px; }
      .map-svg { width: min(54%, 260px); }
      .area-east { right: 14px; }
      .area-west { left: 14px; }
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .map-panel, .info-panel { padding: 18px; border-radius: 22px; }
      .taiwan-map { height: 500px; }
      .map-title { font-size: 0.9rem; }
      .area-btn { min-width: 104px; padding: 9px 10px; font-size: 0.9rem; }
      .area-east { top: 255px; right: 8px; }
      .area-west { top: 255px; left: 8px; }
      .area-north { top: 94px; }
      .area-south { bottom: 70px; }
      .sea-region { font-size: 0.82rem; }
    }
  </style>
</head>

    const subFish3 = document.getElementById("subFish3");

    function updateInfo() {
      const item = data[currentSeason][currentArea];
      fishTitle.textContent = item.fish;
      statusBadge.innerHTML = `<i class="dot ${item.color}"></i>${item.status}`;
      fishDesc.textContent = item.desc;
      fishTip.innerHTML = `<strong>消費建議：</strong>${item.tip}`;
      supplyText.textContent = `${item.supply}%`;
      priceText.textContent = `${item.price}%`;
      ecoText.textContent = `${item.eco}%`;
      supplyBar.style.width = `${item.supply}%`;
      priceBar.style.width = `${item.price}%`;
      ecoBar.style.width = `${item.eco}%`;
      subFish1.textContent = item.subs[0];
      subFish2.textContent = item.subs[1];
      subFish3.textContent = item.subs[2];
    }

    document.querySelectorAll(".season-tabs button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".season-tabs button").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        currentSeason = button.dataset.season;
        updateInfo();
      });
    });

    document.querySelectorAll(".area-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".area-btn").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        currentArea = button.dataset.area;
        updateInfo();
      });
    });
  </script>
</body>
</html>
